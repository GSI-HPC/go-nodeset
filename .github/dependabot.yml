# Weekly version updates.
# There is no gomod entry: the module requires nothing
# (doc/decisions.md, decision 3). The Go release lines in go.mod and
# mise.toml are moved by hand (doc/decisions.md, decision 2).

version: 2

updates:
  # The actions the workflows use, one pull request each: the release
  # workflow does not run on pull requests, so a new major version of one of
  # its actions is reviewed on its own release notes.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-go]
    schedule:
      interval: weekly
    # A release has a week to be found out before it is proposed. Security
    # updates do not wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    commit-message:
      prefix: ci
      include: scope
